# Example Agent Configuration Template
# Copy this file to config.yaml and customize for your needs

# AWS Bedrock Configuration
aws:
  bedrock:
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    region_name: "us-east-1"

# Agent Configuration
agent:
  verbose: true
  max_iterations: 5
  handle_parsing_errors: true

# Execution Control
execution:
  search_cooldown_seconds: 1

# Tool Configuration
# Enable/disable tools and customize their behavior
tools:
  calculator:
    enabled: true
    type: "calculator"
    name: "calculator"
    description: |
      Perform mathematical calculations. Supports basic operations (+, -, *, /, **),
      parentheses, and math functions (sqrt, sin, cos, tan, log, abs, etc.).
      Examples: "2 + 2", "sqrt(16)", "10 ** 2", "sin(pi/2)"

  human_input:
    enabled: true
    type: "human_input"
    name: "ask_human"
    description: |
      Request input or clarification from a human user. Use this when you need:
      - Clarification on ambiguous requests
      - User preferences or choices
      - Additional information not available through other tools
      Ask clear, specific questions that are easy for the user to answer.

  s3_list:
    enabled: true
    type: "s3_list"
    name: "list_s3_files"
    description: |
      List files in an Amazon S3 bucket with optional prefix filtering.
      Use this tool to discover and verify files before reading them.
      Provide the bucket name and optional prefix (folder path).
      This is especially useful for verifying file uploads from S3 signals.

  s3_reader:
    enabled: true
    type: "s3_reader"
    name: "read_s3_file"
    description: |
      Read and analyze files from Amazon S3. Provide the S3 URI in format:
      s3://bucket-name/path/to/file.txt
      This tool is particularly useful for processing files uploaded via S3 signals.

# Prompts Configuration
prompts:
  system_template: |
    You are a helpful AI assistant with access to various tools.

    AVAILABLE TOOLS:
    {tools}

    TOOL NAMES: {tool_names}

    Use this format:

    Thought: Think about what you need to do
    Action: tool_name
    Action Input: the input for the tool
    Observation: the result from the tool
    ... (repeat Thought/Action/Action Input/Observation as needed)
    Thought: I now know the final answer
    Final Answer: the final answer to the original question

    If you can answer directly without using tools, use this format:

    Thought: I can answer this directly
    Final Answer: your response here

    IMPORTANT GUIDELINES:
    - For simple greetings or questions you can answer directly, skip tools and go straight to Final Answer
    - For calculations, use the calculator tool
    - If you need clarification, use the ask_human tool
    - For S3 files, first use list_s3_files to verify the file exists, then use read_s3_file to read it
    - When processing S3 signal events, always list files first to confirm the upload before reading
    - Always use the exact format above - never respond without "Thought:" and "Final Answer:"

    CONVERSATION HISTORY:
    {chat_history}

    Current question: {input}

    {agent_scratchpad}
